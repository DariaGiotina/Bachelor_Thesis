# Base configuration for data loading. All paths are relative to the ml/ folder.
paths:
  labels: labels/scin_labels.csv
  features: features/questionnaire_features.parquet
  splits: splits/train_val_test_splits.json
  images_dir: data/scin/images        # SCIN image files (git-ignored), named by file name only
  image_cache_dir: data/scin/images_448  # downscaled copies (scripts/resize_image_cache.py), read first
  cases_csv: data/scin/scin_cases.csv # holds image_1_path .. image_3_path per case_id

data:
  # Order defines the integer label (0, 1, ...). Cases whose primary_label is in drop_labels
  # are left out (the 'excluded' group is not a target category of the assistant).
  classes: [acne, eczema_dermatitis, redness_rosacea, normal_other]
  drop_labels: [excluded]
  image_size: 224                     # images are resized to image_size x image_size
  primary_image_column: image_1_path  # image used for val/test (and the first choice for train)

loader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true            # keep workers alive between epochs (much faster on Windows)

normalize:                            # ImageNet statistics, applied to every split
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Applied to the train split only; val/test get resize + normalize.
augment:
  horizontal_flip: {p: 0.5}
  affine:                             # shift, scale and rotate
    p: 0.7
    translate_percent: 0.06
    scale: [0.9, 1.1]
    rotate: 15
  color_jitter:
    p: 0.8
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.02                         # kept small so skin colour is not distorted

# Training defaults (override on the command line of train.py).
train:
  backbone: efficientnet_b0
  pretrained: true
  epochs: 15
  early_stopping_patience: 5  # epochs without a better validation macro-F1
  loss_type: weighted_ce      # weighted_ce | focal
  focal_gamma: 2.0
  grad_clip: 1.0
  amp: true                   # mixed precision (GPU only)
  lr: 0.0003
  weight_decay: 0.01
  q_hidden: 64
  p_modality_drop: 0.3   # whole questionnaire hidden for a sample (all masks set to 1)
  p_field_drop: 0.15     # each answered field hidden independently
  eval_missing_rates: [0.0, 0.25, 0.5, 0.75, 1.0]

# Image-only baseline (train.py --model image_only): staged fine-tuning of a timm backbone.
# Stage 1: head only; 2: head + neck + top `top_blocks` backbone blocks; 3: all layers.
# `lr` is the head rate; unfrozen backbone layers train at lr * backbone_lr_mult. Each stage
# starts from the best checkpoint so far and has its own early-stopping patience.
image_baseline:
  backbone: efficientnet_b0        # or mobilenetv3_large_100
  top_blocks: 2
  backbone_lr_mult: 0.1
  drop_rate: 0.2
  run_stages: [1, 2, 3]            # stage 3 is optional: use [1, 2] to skip it
  stages:
    1: {epochs: 5, lr: 1.0e-3}
    2: {epochs: 15, lr: 3.0e-4}
    3: {epochs: 10, lr: 1.0e-4}

# Questionnaire-only baseline (run_q_only.py, E1 arm 2): MLP over [q_vec, q_mask], no image.
q_baseline:
  hidden: 64
  depth: 2
  dropout: 0.2
  lr: 1.0e-3
  weight_decay: 0.01
  epochs: 200
  early_stopping_patience: 20   # epochs are fast (no images), so patience is longer
  p_field_drop: 0.0             # 0 = plain baseline; > 0 hides single answers in training (robustness)

# Photo + questionnaire fusion (models/fusion_model.py; train.py --model fusion, run_fusion.py).
# Trained with the staged recipe of image_baseline; questionnaire branch and fusion layers train
# in every stage at the head learning rate. Answers are hidden in training with
# train.p_modality_drop / train.p_field_drop (modality dropout).
fusion:
  variant: concat        # concat (late fusion) | gated (gated multimodal unit) | film (FiLM-style)
  q_hidden: 64
  q_depth: 2
  q_dropout: 0.1
  fused_dim: 256         # gated fusion only
  head_dropout: 0.2
