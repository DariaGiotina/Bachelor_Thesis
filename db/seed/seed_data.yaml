# Shared seed data (schema v1). The single source for both databases: a generator outside the
# repository turns it into the INSERT statements of db/postgres/seed.sql and into db/mongo/seed.js,
# so PostgreSQL and MongoDB hold identical data. Keys written here as short names (ana, ana_a1)
# become deterministic UUIDs (uuid5), so every run produces the same identifiers.
# Allowed values: db/data_dictionary.md. Sources and licences: db/data_sources.md.
# All people are fictitious; no real photo exists for any photo key.

version: 1
reference_time: "2026-11-01T09:00:00Z"   # "now" of the seed; every date below is before it

skin_concerns:   # the four categories of the exported model, in model order
  - {code: acne, name: Acne, description: "Spots such as blackheads, whiteheads or red bumps, often on the face, chest or back. The app only describes what the photo resembles; it does not diagnose."}
  - {code: eczema_dermatitis, name: "Eczema or dermatitis", description: "Dry, itchy or flaky patches of irritated skin. The app only describes what the photo resembles; it does not diagnose."}
  - {code: redness_rosacea, name: "Redness or rosacea", description: "Lasting redness, flushing or small visible vessels, often on the cheeks and nose. The app only describes what the photo resembles; it does not diagnose."}
  - {code: normal_other, name: "Normal or other", description: "No sign of the three categories above. Other skin conditions are outside what the app can recognise."}

face_zones:
  - {code: forehead, name: Forehead}
  - {code: nose, name: Nose}
  - {code: left_cheek, name: "Left cheek"}
  - {code: right_cheek, name: "Right cheek"}
  - {code: chin, name: Chin}
  - {code: jawline, name: Jawline}

# Questions follow ml/features/field_mapping.md (SCIN wording and codes) plus the red-flag question
# of Task 4.2b. Options: [value, label] or [value, label, red_flag]; position = order in the list.
questions:
  - id: 1
    field_key: age_group
    text: "What is your age?"
    answer_type: single
    options:
      - [AGE_18_TO_29, "18-29"]
      - [AGE_30_TO_39, "30-39"]
      - [AGE_40_TO_49, "40-49"]
      - [AGE_50_TO_59, "50-59"]
      - [AGE_60_TO_69, "60-69"]
      - [AGE_70_TO_79, "70-79"]
      - [AGE_UNKNOWN, "I prefer not to say"]
  - id: 2
    field_key: body_area
    text: "Where on your body is the issue? (select all)"
    answer_type: multi
    options:
      - [head_or_neck, "Head or neck"]
      - [arm, Arm]
      - [palm, Palm]
      - [back_of_hand, "Back of hand"]
      - [torso_front, "Torso, front"]
      - [torso_back, "Torso, back"]
      - [genitalia_or_groin, "Genitalia or groin"]
      - [buttocks, Buttocks]
      - [leg, Leg]
      - [foot_top_or_side, "Top or side of foot"]
      - [foot_sole, "Sole of foot"]
      - [other, Other]
  - id: 3
    field_key: symptoms
    text: "Are you experiencing any of the following with your skin issue? (select all)"
    answer_type: multi
    options:
      - [bothersome_appearance, "Concerning in appearance"]
      - [bleeding, Bleeding, true]
      - [increasing_size, "Increasing in size", true]
      - [darkening, Darkening, true]
      - [itching, Itching]
      - [burning, Burning]
      - [pain, Pain, true]
      - [no_relevant_experience, "None of the above"]
  - id: 4
    field_key: texture
    text: "Describe how the affected skin area feels (select all)"
    answer_type: multi
    options:
      - [raised_or_bumpy, "Raised or bumpy"]
      - [flat, Flat]
      - [rough_or_flaky, "Rough or flaky"]
      - [fluid_filled, "Filled with fluid"]
  - id: 5
    field_key: duration
    text: "For how long have you had this skin issue?"
    answer_type: ordinal          # position = rank 1-8; UNKNOWN is last and is not a rank
    options:
      - [ONE_DAY, "1 day"]
      - [LESS_THAN_ONE_WEEK, "Less than 1 week"]
      - [ONE_TO_FOUR_WEEKS, "1-4 weeks"]
      - [ONE_TO_THREE_MONTHS, "1-3 months"]
      - [THREE_TO_TWELVE_MONTHS, "3-12 months"]
      - [MORE_THAN_ONE_YEAR, "More than 1 year"]
      - [MORE_THAN_FIVE_YEARS, "More than 5 years"]
      - [SINCE_CHILDHOOD, "Since childhood"]
      - [UNKNOWN, "I don't know"]
  - id: 6
    field_key: skin_type
    text: "How does your skin react to sun exposure?"
    answer_type: single
    options:
      - [FST1, "Always burns, never tans"]
      - [FST2, "Usually burns, lightly tans"]
      - [FST3, "Sometimes burns, evenly tans"]
      - [FST4, "Rarely burns, tans well"]
      - [FST5, "Very rarely burns, easily tans"]
      - [FST6, "Never burns, always tans"]
      - [NONE_IDENTIFIED, "None of the above"]
  - id: 7
    field_key: lesion_change
    text: "Has the spot appeared recently or changed in size, shape or colour?"
    answer_type: single
    options:
      - ["yes", "Yes", true]
      - ["no", "No"]
      - [not_sure, "Not sure"]

